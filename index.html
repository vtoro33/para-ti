<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres verme?</title>
<style>
  :root{
    --void:       #05060f;
    --deep-navy:  #0b0e23;
    --star-white: #f5f3ff;
    --lavender:   #b9bde0;
    --gold:       #f2c879;
    --rose:       #e88ba0;
    --rose-glow:  rgba(232,139,160,0.45);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--deep-navy) 0%, var(--void) 70%);
    overflow:hidden;
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  @font-face{
    font-family:'Caveat';
    src: local('Caveat');
  }

  #sky{
    position:fixed; inset:0; width:100%; height:100%; display:block;
  }

  .stage{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- CARD ---------- */
  .card{
    position:relative;
    z-index:5;
    width:min(90vw, 420px);
    padding:48px 36px 40px;
    text-align:center;
    background: rgba(15,18,42,0.55);
    border: 1px solid rgba(185,189,224,0.18);
    border-radius:22px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 80px rgba(90,70,160,0.15) inset;
    transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
  }

  .card.fade-out{
    opacity:0;
    transform: scale(0.92);
    filter: blur(8px);
    pointer-events:none;
  }

  .card h1{
    font-family:'Caveat', 'Segoe Script', cursive;
    font-weight:700;
    font-size:clamp(30px, 6vw, 40px);
    color: var(--star-white);
    line-height:1.25;
    letter-spacing:0.3px;
    text-shadow: 0 0 22px rgba(242,200,121,0.25);
    margin-bottom: 10px;
  }

  .card p.sub{
    color: var(--lavender);
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:34px;
    opacity:0.7;
  }

  .btn-row{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }

  button{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    border:none;
    border-radius:999px;
    cursor:pointer;
    outline-offset:4px;
    white-space:nowrap;
  }

  #yesBtn{
    position:relative;
    z-index:3;
    padding:14px 34px;
    font-size:16px;
    color:#221226;
    background: linear-gradient(135deg, var(--gold), var(--rose));
    box-shadow: 0 8px 26px var(--rose-glow);
    transform-origin:center;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.35s ease;
  }
  #yesBtn:active{ transform: scale(0.97); }

  #noBtn{
    position:relative;
    z-index:4;
    padding:14px 30px;
    font-size:16px;
    color: var(--star-white);
    background: linear-gradient(135deg, #e5484d, #b0242c);
    box-shadow: 0 8px 22px rgba(229,72,77,0.4);
    transition: left 0.35s ease, top 0.35s ease, opacity 0.3s ease;
  }

  /* ---------- FINALE ---------- */
  .finale{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 0 24px;
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease;
    z-index:6;
  }
  .finale.show{ opacity:1; pointer-events:auto; }

  #constellation{
    width:min(80vw, 320px);
    height:min(80vw, 320px);
    margin-bottom:28px;
  }

  #constellation .line{
    fill:none;
    stroke: var(--gold);
    stroke-width:1.6;
    stroke-linecap:round;
    filter: drop-shadow(0 0 6px rgba(242,200,121,0.6));
  }
  #constellation .point{
    fill: var(--star-white);
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.9));
  }

  .finale-text{
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size: clamp(22px, 5vw, 30px);
    color: var(--star-white);
    max-width: 480px;
    line-height:1.5;
    min-height: 90px;
  }

  .finale-text .cursor{
    display:inline-block;
    width:2px;
    background: var(--gold);
    margin-left:2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    #yesBtn, #noBtn, .card{ transition:none !important; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div class="stage">
  <div class="card" id="card">
    <h1>Quiero verte...<br>¿Tú quieres verme?</h1>
    <p class="sub">Responde con sinceridad</p>
    <div class="btn-row">
      <button id="yesBtn">Sí</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <div class="finale" id="finale">
    <svg id="constellation" viewBox="0 0 300 300"></svg>
    <p class="finale-text" id="finaleText"><span class="cursor">&nbsp;</span></p>
  </div>
</div>

<script>
/* ================= STARFIELD ================= */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let stars = [];

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const count = Math.floor((canvas.width * canvas.height) / 2800);
  stars = Array.from({length: count}, () => {
    const big = Math.random() < 0.12; // un puñado de estrellas más grandes y brillantes
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: big ? (Math.random() * 1.1 + 1.4) : (Math.random() * 1.1 + 0.3),
      baseAlpha: big ? (Math.random() * 0.3 + 0.6) : (Math.random() * 0.55 + 0.25),
      speed: Math.random() * 0.035 + 0.006,
      offset: Math.random() * Math.PI * 2
    };
  });
}
window.addEventListener('resize', resize);
resize();

let t = 0;
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  t += 1;
  for(const s of stars){
    const twinkle = Math.sin(t * s.speed + s.offset) * 0.5 + 0.5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(245,243,255,${s.baseAlpha * (0.35 + twinkle * 0.65)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

/* occasional shooting star */
function shootingStar(){
  const startX = Math.random() * canvas.width * 0.6 + canvas.width*0.2;
  const startY = Math.random() * canvas.height * 0.2;
  const len = 140 + Math.random()*60;
  const dur = 900;
  const startTime = performance.now();

  function frame(now){
    const p = Math.min((now - startTime) / dur, 1);
    if(p < 1){
      ctx.save();
      ctx.strokeStyle = `rgba(242,200,121,${1-p})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX + len*p, startY + len*p*0.5);
      ctx.lineTo(startX + len*p - len*0.35, startY + len*p*0.5 - len*0.18);
      ctx.stroke();
      ctx.restore();
      requestAnimationFrame(frame);
    }
  }
  requestAnimationFrame(frame);
  setTimeout(shootingStar, 4000 + Math.random()*6000);
}
setTimeout(shootingStar, 3000);

/* ================= TRACKING ================= */
/* Reemplaza esta URL por tu propio endpoint de Formspree (ver instrucciones) */
const FORM_ENDPOINT = "https://formspree.io/f/xnpazewb";

function track(eventName, extra={}){
  const payload = {
    event: eventName,
    timestamp: new Date().toLocaleString('es-CO', { dateStyle:'full', timeStyle:'medium' }),
    ...extra
  };
  fetch(FORM_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(payload)
  }).catch(()=>{ /* si falla, no interrumpe la experiencia */ });
}

/* ================= BUTTON LOGIC ================= */
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const btnRow = document.querySelector('.btn-row');
const card = document.getElementById('card');
const finale = document.getElementById('finale');

const noPhrases = [
  "No", "¿Seguro?", "Piénsalo bien...", "¿En serio?",
  "Última oportunidad", "No creo que quieras eso", "Mejor dale al otro",
  "¿De verdad, de verdad?", "Casi casi...", "Estás muy cerca",
  "Ríndete ya 😏", "Ni lo pienses"
];

let attempts = 0;
let noBtnWidth = 0;
let noBtnHeight = 0;
const MAX_SCALE_YES = 3.6;

let lastDodgeTime = 0;
function dodge(){
  // evita que un mismo toque dispare el evento dos veces (pointerenter + touchstart)
  const now = Date.now();
  if (now - lastDodgeTime < 250) return;
  lastDodgeTime = now;

  attempts++;

  // La primera vez, sacamos el botón del flujo normal y lo anclamos DENTRO de la tarjeta
  // (posición absoluta relativa a .card, no a la ventana — así nunca depende del tamaño de pantalla)
  if(attempts === 1){
    const rect = noBtn.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();
    noBtnWidth = rect.width;
    noBtnHeight = rect.height;
    noBtn.style.position = 'absolute';
    noBtn.style.left = `${rect.left - cardRect.left}px`;
    noBtn.style.top = `${rect.top - cardRect.top}px`;
    noBtn.offsetHeight; // forzar reflow
  }

  const inset = 10;
  const cardW = card.clientWidth;
  const cardH = card.clientHeight;

  const usableW = Math.max(cardW - noBtnWidth - inset * 2, 1);
  const usableH = Math.max(cardH - noBtnHeight - inset * 2, 1);

  // El botón salta a puntos a lo largo del BORDE de la tarjeta (no del centro),
  // así nunca queda cerca ni encima del botón "Sí"
  const top = usableW;      // borde superior
  const right = usableH;    // borde derecho
  const bottom = usableW;   // borde inferior
  const left = usableH;     // borde izquierdo
  const total = top + right + bottom + left;

  let r = Math.random() * total;
  let newLeft, newTop;

  if (r < top){
    newLeft = inset + r;
    newTop = inset;
  } else if (r < top + right){
    newLeft = inset + usableW;
    newTop = inset + (r - top);
  } else if (r < top + right + bottom){
    newLeft = inset + usableW - (r - top - right);
    newTop = inset + usableH;
  } else {
    newLeft = inset;
    newTop = inset + usableH - (r - top - right - bottom);
  }

  noBtn.style.left = `${newLeft}px`;
  noBtn.style.top = `${newTop}px`;

  // el texto NUNCA se encoge, solo cambia el mensaje para mantenerlo legible
  noBtn.textContent = noPhrases[Math.min(attempts - 1, noPhrases.length - 1)];

  const yesScale = Math.min(MAX_SCALE_YES, 1 + attempts * 0.14);
  yesBtn.style.transform = `scale(${yesScale})`;

  track("intento_no", { intento_numero: attempts, texto_boton: noBtn.textContent });
}

// El botón "No" se mueve apenas el cursor (o el dedo) se acerca — no hace falta hacer clic
noBtn.addEventListener('pointerenter', (e) => { dodge(); });
// respaldo por si algún navegador móvil no dispara pointerenter con el toque
noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, {passive:false});

yesBtn.addEventListener('click', () => {
  track("dijo_que_si", { intentos_de_no: attempts });
  card.classList.add('fade-out');
  setTimeout(() => {
    finale.classList.add('show');
    drawConstellation();
    typeMessage("Como las estrellas que forman una constelación, cada momento se va conectando 🌠💫");
  }, 500);
});

/* ================= CONSTELLATION (heart shape) ================= */
function heartPoints(n){
  const pts = [];
  for(let i=0;i<n;i++){
    const t = (i / n) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    pts.push({ x: 150 + x*7, y: 150 + y*7 });
  }
  return pts;
}

function drawConstellation(){
  const svg = document.getElementById('constellation');
  svg.innerHTML = '';
  const pts = heartPoints(14);

  let d = `M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){ d += ` L ${pts[i].x} ${pts[i].y}`; }
  d += ` L ${pts[0].x} ${pts[0].y}`;

  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  path.setAttribute("class", "line");
  const length = 1400;
  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
  path.style.transition = "stroke-dashoffset 2.4s ease";
  svg.appendChild(path);

  requestAnimationFrame(() => {
    setTimeout(() => { path.style.strokeDashoffset = 0; }, 50);
  });

  pts.forEach((p, i) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", p.x);
    c.setAttribute("cy", p.y);
    c.setAttribute("r", 0);
    c.setAttribute("class", "point");
    svg.appendChild(c);
    setTimeout(() => {
      c.style.transition = "r 0.4s ease";
      c.setAttribute("r", 3.2);
    }, 80 * i + 200);
  });
}

/* ================= TYPEWRITER ================= */
function typeMessage(text){
  const el = document.getElementById('finaleText');
  el.innerHTML = '<span class="cursor">&nbsp;</span>';
  let i = 0;
  const speed = 38;
  function step(){
    if(i <= text.length){
      el.innerHTML = text.slice(0, i) + '<span class="cursor">&nbsp;</span>';
      i++;
      setTimeout(step, speed);
    }
  }
  setTimeout(step, 2600);
}
</script>
</body>
</html>
